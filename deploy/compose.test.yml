x-api: &api
  image: fleet-backend:test
  build: ../backend
  environment: &environment
    ENVIRONMENT: test
    DATABASE_URL: postgresql+psycopg://fleet:test-password@database/fleet_test
    STORAGE_PROVIDER: s3
    S3_ENDPOINT: http://storage:9000
    S3_BUCKET: fleet-test
    S3_ACCESS_KEY: fleet-test
    S3_SECRET_KEY: test-storage-password
    S3_REGION: us-east-1
    CORS_ORIGINS: https://localhost:18443
    COOKIE_SECURE: 'false'
  read_only: true
  tmpfs: [/tmp]

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: fleet_test
      POSTGRES_USER: fleet_admin
      POSTGRES_PASSWORD: test-admin-password
      POSTGRES_APP_USER: fleet
      POSTGRES_APP_PASSWORD_FILE: /run/secrets/test_database_password
    volumes:
      - test_database:/var/lib/postgresql/data
      - ./postgres/init-app.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    secrets: [test_database_password]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U fleet_admin -d fleet_test]
      interval: 2s
      timeout: 3s
      retries: 30
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: fleet-test
      MINIO_ROOT_PASSWORD: test-storage-password
    volumes: [test_storage:/data]
  storage-init:
    <<: *api
    healthcheck: {disable: true}
    command:
      - python
      - -c
      - |
        import time
        from app.services.storage import get_storage
        store = get_storage()
        for attempt in range(60):
            try:
                store.client.list_buckets()
                break
            except Exception:
                time.sleep(1)
        else:
            raise RuntimeError('Object storage did not start')
        if not any(b['Name'] == store.bucket for b in store.client.list_buckets()['Buckets']):
            store.client.create_bucket(Bucket=store.bucket)
    depends_on: [storage]
  migrate:
    <<: *api
    command: [python, -m, app.scripts.migrate]
    healthcheck: {disable: true}
    depends_on:
      database: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
  backend:
    <<: *api
    ports: ['127.0.0.1:18000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
  frontend:
    image: fleet-frontend:test
    build: ../frontend
    ports: ['127.0.0.1:13000:3000']
  proxy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: localhost
      ACME_EMAIL: ci@example.com
    ports: ['127.0.0.1:18443:443']
    volumes: ['./Caddyfile:/etc/caddy/Caddyfile:ro']
    healthcheck:
      test: [CMD, wget, --no-check-certificate, -q, -O, /dev/null, https://localhost/health/ready]
      interval: 3s
      timeout: 5s
      retries: 30
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
  backup:
    image: fleet-backup:test
    build:
      context: ..
      dockerfile: deploy/backup/Dockerfile
    profiles: [backup]
    environment:
      PGHOST: database
      PGDATABASE: fleet_test
      PGUSER: fleet
      PGPASSWORD: test-password
      BACKUP_S3_ENDPOINT: http://storage:9000
      BACKUP_S3_BUCKET: fleet-test
      BACKUP_S3_ACCESS_KEY: fleet-test
      BACKUP_S3_SECRET_KEY: test-storage-password
      BACKUP_PREFIX: ci-backups
      BACKUP_RETENTION_DAYS: '7'
    volumes: ['${BACKUP_TEST_DIR:-/tmp/fleet-backup-test}:/test']
volumes:
  test_database:
  test_storage:
secrets:
  test_database_password:
    file: ./test-db-password.txt
