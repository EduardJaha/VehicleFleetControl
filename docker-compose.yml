services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: sqlite:///./data/vehiclemanagement.db
      ENVIRONMENT: development
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-local-development-secret}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      UPLOAD_DIRECTORY: uploads
    ports:
      - "8000:8000"
    command: sh -c "pip install -r requirements.txt && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend
